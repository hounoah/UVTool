<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>uV Directory</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #282a36;
    --surface: #21222c;
    --surface-hover: #343746;
    --border: #44475a;
    --text: #f8f8f2;
    --text-dim: #bfbfbf;
    --text-muted: #6272a4;
    --accent: #bd93f9;
    --accent-glow: rgba(189,147,249,0.12);
    --green: #50fa7b;
    --green-dim: rgba(80,250,123,0.12);
    --red: #ff5555;
    --red-dim: rgba(255,85,85,0.10);
    --purple: #ff79c6;
    --cyan: #8be9fd;
    --amber: #f1fa8c;
    --amber-dim: rgba(241,250,140,0.10);
  }

  html.light {
    --bg: #f4f5f7;
    --surface: #ffffff;
    --surface-hover: #eef0f4;
    --border: #d1d5db;
    --text: #1e293b;
    --text-dim: #64748b;
    --text-muted: #94a3b8;
    --accent: #2563eb;
    --accent-glow: rgba(37,99,235,0.10);
    --green: #16a34a;
    --green-dim: rgba(22,163,74,0.10);
    --red: #dc2626;
    --red-dim: rgba(220,38,38,0.08);
    --purple: #7c3aed;
    --cyan: #0891b2;
    --amber: #d97706;
    --amber-dim: rgba(217,119,6,0.08);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'IBM Plex Sans', -apple-system, sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.5;
    min-height: 100vh;
  }

  /* ── HEADER ── */
  .header {
    position: sticky; top: 0; z-index: 100;
    background: rgba(40,42,54,0.90);
    backdrop-filter: blur(16px);
    border-bottom: 1px solid var(--border);
    padding: 12px 24px;
  }
  html.light .header { background: rgba(244,245,247,0.90); }

  .header-row {
    max-width: 1400px; margin: 0 auto;
    display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
  }
  .logo {
    font-family: 'IBM Plex Mono', monospace;
    font-weight: 700; font-size: 18px;
    color: var(--accent); letter-spacing: -0.5px; white-space: nowrap;
  }
  .logo span { color: var(--text-dim); font-weight: 400; }

  .search-box {
    flex: 1; min-width: 220px; max-width: 480px; position: relative;
  }
  .search-box svg {
    position: absolute; left: 12px; top: 50%; transform: translateY(-50%);
    color: var(--text-muted); pointer-events: none;
  }
  .search-box input {
    width: 100%; padding: 10px 12px 10px 40px;
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 8px; color: var(--text);
    font-family: 'IBM Plex Sans', sans-serif; font-size: 14px;
    outline: none; transition: border-color 0.2s, box-shadow 0.2s;
  }
  .search-box input::placeholder { color: var(--text-muted); }
  .search-box input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-glow); }

  .kbd-hint {
    font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: var(--text-muted);
    padding: 3px 8px; border: 1px solid var(--border); border-radius: 4px;
    position: absolute; right: 12px; top: 50%; transform: translateY(-50%);
    pointer-events: none; transition: opacity 0.2s;
  }

  .stats {
    font-family: 'IBM Plex Mono', monospace; font-size: 12px;
    color: var(--text-dim); white-space: nowrap;
  }
  .stats strong { color: var(--text); }

  .theme-toggle {
    width: 36px; height: 36px; border-radius: 8px;
    border: 1px solid var(--border); background: var(--surface);
    color: var(--text-dim); cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.15s; flex-shrink: 0;
  }
  .theme-toggle:hover { border-color: var(--accent); color: var(--accent); background: var(--accent-glow); }
  .theme-toggle svg { width: 18px; height: 18px; }
  .theme-toggle .icon-sun { display: none; }
  html.light .theme-toggle .icon-moon { display: none; }
  html.light .theme-toggle .icon-sun { display: block; }

  .hide-removed-btn {
    display: inline-flex; align-items: center; gap: 6px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px; font-weight: 500;
    padding: 6px 12px; border-radius: 8px;
    border: 1px solid var(--border); background: var(--surface);
    color: var(--text-dim); cursor: pointer; transition: all 0.15s;
    white-space: nowrap;
  }
  .hide-removed-btn:hover { border-color: var(--red); color: var(--red); background: var(--red-dim); }
  .hide-removed-btn.active { border-color: var(--red); color: var(--red); background: var(--red-dim); }
  .hide-removed-btn svg { flex-shrink: 0; }

  .reset-btn {
    display: inline-flex; align-items: center; gap: 6px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px; font-weight: 500;
    padding: 6px 12px; border-radius: 8px;
    border: 1px solid var(--border); background: var(--surface);
    color: var(--text-dim); cursor: pointer; transition: all 0.15s;
    white-space: nowrap;
  }
  .reset-btn:hover { border-color: var(--accent); color: var(--accent); background: var(--accent-glow); }
  .reset-btn svg { flex-shrink: 0; }

  /* ── FILTER BAR ── */
  .filter-bar {
    max-width: 1400px; margin: 0 auto; padding: 16px 24px 0;
    display: flex; flex-wrap: wrap; gap: 8px; align-items: center;
  }
  .filter-label {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10px; font-weight: 600; text-transform: uppercase;
    letter-spacing: 1px; color: var(--text-muted); margin-right: 4px;
  }
  .filter-group { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; }
  .filter-group + .filter-group { margin-left: 12px; padding-left: 12px; border-left: 1px solid var(--border); }
  .filter-chip {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px; font-weight: 500;
    padding: 4px 10px; border-radius: 6px;
    background: var(--surface); border: 1px solid var(--border);
    color: var(--text-dim); cursor: pointer;
    transition: all 0.15s; text-decoration: none; user-select: none; white-space: nowrap;
  }
  .filter-chip:hover { background: var(--surface-hover); border-color: var(--accent); color: var(--text); }
  .filter-chip.active { background: var(--accent-glow); border-color: var(--accent); color: var(--accent); }
  .filter-chip .chip-ct {
    display: inline-block; margin-left: 3px; padding: 0 5px;
    border-radius: 8px; background: rgba(255,255,255,0.06); font-size: 10px;
  }
  html.light .filter-chip .chip-ct { background: rgba(0,0,0,0.05); }

  .clear-filters {
    font-family: 'IBM Plex Mono', monospace; font-size: 11px;
    padding: 4px 10px; border-radius: 6px;
    background: var(--red-dim); border: 1px solid transparent;
    color: var(--red); cursor: pointer; transition: all 0.15s;
    display: none;
  }
  .clear-filters.show { display: inline-flex; }
  .clear-filters:hover { border-color: var(--red); }

  /* ── MAIN ── */
  .main { max-width: 1400px; margin: 0 auto; padding: 20px 24px; }

  /* ── TABLE ── */
  .tbl { width: 100%; border-collapse: collapse; font-size: 13px; }
  .tbl th {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.8px;
    color: var(--text-muted); text-align: left;
    padding: 8px 12px; background: var(--surface);
    border-bottom: 1px solid var(--border);
    position: sticky; top: 56px; z-index: 5;
    cursor: pointer; user-select: none; transition: color 0.15s;
    white-space: nowrap;
  }
  .tbl th:hover { color: var(--text); }
  .tbl th .sort-arrow { font-size: 9px; margin-left: 4px; opacity: 0.3; }
  .tbl th.sorted .sort-arrow { opacity: 1; color: var(--accent); }
  .tbl th:first-child { border-radius: 6px 0 0 0; }
  .tbl th:last-child { border-radius: 0 6px 0 0; }
  .tbl td {
    padding: 8px 12px;
    border-bottom: 1px solid rgba(42,49,64,0.35);
    vertical-align: middle;
  }
  html.light .tbl td { border-bottom-color: rgba(209,213,219,0.5); }
  .tbl tr:hover td { background: var(--surface-hover); }
  .tbl tr.removed td { opacity: 0.4; }
  .tbl tr.expanded td { background: var(--accent-glow); border-bottom-color: transparent; }

  .col-client { font-weight: 600; color: var(--cyan); font-family: 'IBM Plex Mono', monospace; font-size: 12.5px; letter-spacing: -0.2px; }
  .col-sys { font-family: 'IBM Plex Mono', monospace; font-weight: 600; color: var(--purple); font-size: 12px; }
  .col-aws, .col-vmdb {
    font-family: 'IBM Plex Mono', monospace; font-size: 11.5px; color: var(--text-dim);
  }
  .col-url a {
    color: var(--accent); text-decoration: none;
    font-family: 'IBM Plex Mono', monospace; font-size: 11.5px;
    word-break: break-all; transition: color 0.15s;
  }
  .col-url a:hover { color: #60a5fa; text-decoration: underline; }

  .badge {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 9px; font-weight: 600; text-transform: uppercase;
    letter-spacing: 0.5px; padding: 2px 6px; border-radius: 4px;
    display: inline-block;
  }
  .badge-removed { background: var(--red-dim); color: var(--red); }
  .badge-vmdb-only { background: var(--amber-dim); color: var(--amber); }

  .dist-toggle {
    font-family: 'IBM Plex Mono', monospace; font-size: 10px; font-weight: 600;
    padding: 3px 8px; border-radius: 5px;
    border: 1px solid var(--border); background: var(--surface);
    color: var(--text-dim); cursor: pointer; transition: all 0.15s;
    white-space: nowrap;
  }
  .dist-toggle:hover { border-color: var(--cyan); color: var(--cyan); background: rgba(34,211,238,0.06); }
  .dist-toggle.open { border-color: var(--cyan); color: var(--cyan); background: rgba(34,211,238,0.08); }

  /* ── DISTRICT EXPAND ROW ── */
  .dist-row { display: none; }
  .dist-row.open { display: table-row; }
  .dist-row td {
    padding: 0 12px 12px 12px;
    background: rgba(34,211,238,0.03);
    border-bottom: 2px solid var(--border);
  }
  .dist-inner {
    border: 1px solid var(--border); border-radius: 8px;
    overflow: hidden; margin-top: 8px;
  }
  .dist-header {
    display: flex; align-items: center; gap: 10px;
    padding: 8px 14px; background: var(--surface);
    font-family: 'IBM Plex Mono', monospace; font-size: 11px;
    border-bottom: 1px solid var(--border);
  }
  .dist-header .dh-label { color: var(--text-muted); font-weight: 500; text-transform: uppercase; letter-spacing: 0.5px; }
  .dist-header .dh-val { color: var(--text-dim); word-break: break-all; flex: 1; }
  .dist-tbl { width: 100%; border-collapse: collapse; }
  .dist-tbl th {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 9px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.8px;
    color: var(--text-muted); text-align: left;
    padding: 6px 14px; background: var(--surface);
    border-bottom: 1px solid var(--border);
    position: static;
  }
  .dist-tbl td {
    padding: 6px 14px; border-bottom: 1px solid rgba(42,49,64,0.25);
    font-size: 12px; background: transparent;
  }
  .dist-tbl tr:last-child td { border-bottom: none; }
  .dist-tbl tr:hover td { background: var(--surface-hover); }
  .d-code { font-family: 'IBM Plex Mono', monospace; font-weight: 600; color: var(--purple); font-size: 11px; }
  .d-name { font-weight: 500; color: var(--text); font-size: 12px; }
  .d-guid { font-family: 'IBM Plex Mono', monospace; font-size: 10px; color: var(--text-dim); word-break: break-all; }

  .copy-btn {
    display: inline-flex; align-items: center; gap: 4px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10px; font-weight: 500;
    padding: 3px 7px; border-radius: 4px;
    border: 1px solid var(--border); background: var(--surface);
    color: var(--text-dim); cursor: pointer; transition: all 0.15s; white-space: nowrap;
  }
  .copy-btn:hover { border-color: var(--accent); color: var(--accent); background: var(--accent-glow); }
  .copy-btn.copied { border-color: var(--green); color: var(--green); background: var(--green-dim); }

  /* ── CREDENTIALS BOX ── */
  .cred-box {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 10px; padding: 14px 16px; margin-bottom: 20px;
  }
  .cred-box-head {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
  }
  .cred-box-title {
    display: flex; align-items: center; gap: 8px;
    font-family: 'IBM Plex Mono', monospace; font-size: 13px;
    font-weight: 600; color: var(--accent); letter-spacing: -0.3px;
  }
  .cred-toggle {
    font-family: 'IBM Plex Mono', monospace; font-size: 12px; font-weight: 500;
    padding: 6px 12px; border-radius: 6px;
    border: 1px solid var(--border); background: var(--surface);
    color: var(--text-dim); cursor: pointer; transition: all 0.15s; white-space: nowrap;
  }
  .cred-toggle:hover { border-color: var(--accent); color: var(--accent); background: var(--accent-glow); }
  .cred-body { display: none; margin-top: 14px; }
  .cred-box.revealed .cred-body { display: flex; flex-direction: column; gap: 8px; }
  .cred-row {
    display: flex; align-items: center; gap: 10px;
    padding-top: 8px; border-top: 1px solid var(--border);
  }
  .cred-row:first-child { padding-top: 0; border-top: none; }
  .cred-label {
    font-family: 'IBM Plex Mono', monospace; font-size: 11px;
    color: var(--text-muted); min-width: 80px;
  }
  .cred-value {
    font-family: 'IBM Plex Mono', monospace; font-size: 13px;
    color: var(--text); background: var(--bg);
    border: 1px solid var(--border); border-radius: 4px;
    padding: 3px 8px; word-break: break-all; flex: 1;
  }

  .no-results { text-align: center; padding: 60px 20px; color: var(--text-muted); font-size: 15px; }
  .no-results kbd {
    display: inline-block; padding: 2px 8px; background: var(--surface);
    border: 1px solid var(--border); border-radius: 4px;
    font-family: 'IBM Plex Mono', monospace; font-size: 13px; color: var(--text-dim);
  }

  mark { background: rgba(189,147,249,0.25); color: var(--text); border-radius: 2px; padding: 0 1px; }
  html.light mark { background: rgba(37,99,235,0.15); color: var(--text); }

  @keyframes fadeUp { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
  .main { animation: fadeUp 0.2s ease; }

  @media (max-width: 900px) {
    .header-row { gap: 10px; }
    .search-box { min-width: 100%; order: 10; }
    .main { padding: 12px; }
    .tbl td, .tbl th { padding: 6px 8px; font-size: 11px; }
    .filter-bar { padding: 10px 12px 0; gap: 6px; }
    .filter-group + .filter-group { margin-left: 6px; padding-left: 6px; }
    .col-url { display: none; }
  }
</style>
</head>

<div class="header">
  <div class="header-row">
    <div class="logo">uV<span> / directory</span></div>
    <div class="search-box">

      <span>Reset</span>
    </button>
    <button class="theme-toggle" id="themeToggle" title="Toggle theme">
      <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>

    </button>
  </div>
</div>

<div class="filter-bar" id="filterBar"></div>

<div class="main">
  <div class="cred-box" id="credBox">
    <div class="cred-box-head">
      <div class="cred-box-title">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
        <span>Credentials</span>
      </div>
      <button class="cred-toggle" id="credToggle" onclick="toggleCreds()">Show Credentials</button>
    </div>
    <div class="cred-body" id="credBody">
      <div class="cred-row">
        <span class="cred-label">Username</span>
        <code class="cred-value">99</code>
        <button class="copy-btn" onclick="copyText(this,'99')"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg></button>
      </div>
      <div class="cred-row">
        <span class="cred-label">Password</span>
        <code class="cred-value">59AZuTdepGqP7qEDtUD3Q7!</code>
        <button class="copy-btn" onclick="copyText(this,'59AZuTdepGqP7qEDtUD3Q7!')"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg></button>
      </div>
    </div>
  </div>
  <div id="content"></div>
</div>

// ── MERGE DATA ──
function buildMerged() {
  const map = {};

  // Helper to get/create entry by sysCode
  function getEntry(code) {
    if (!code) return null;
    const k = code.toUpperCase();
    if (!map[k]) map[k] = { sysCode: code, clients: [], awsServer: '', vmdbServer: '', url: '', removed: false, vmdbRemoved: false, vmdbOnly: false, districts: [], operatorName: '', operatorGuid: '' };
    return map[k];
  }

  // 1. UVP instances
  UVP_DATA.forEach(d => {
    const e = getEntry(d.sysCode);
    if (!e) return;
    if (!e.clients.length || !e.clients.includes(d.client)) e.clients.push(d.client);
    e.awsServer = d.server;
    e.url = d.url || e.url;
    if (d.client.toLowerCase().includes('-removed')) e.removed = true;
  });

  // 2. VMDB active
  VMDB_DATA.forEach(d => {
    const e = getEntry(d.sysCode);
    if (!e) return;
    if (!e.clients.length) { e.clients.push(d.client); e.vmdbOnly = true; }
    else if (!e.clients.some(c => c.toLowerCase().replace(/\s/g,'') === d.client.toLowerCase().replace(/\s/g,''))) {
      // Don't dupe if essentially same name
    }
    e.vmdbServer = d.server;
  });

  // 3. VMDB removed
  VMDB_REMOVED.forEach(d => {
    const e = getEntry(d.sysCode);
    if (!e) return;
    if (!e.clients.length) { e.clients.push(d.client); e.vmdbOnly = true; }
    if (!e.vmdbServer) e.vmdbServer = d.server;
    e.vmdbRemoved = true;
    if (!e.awsServer) e.removed = true;
  });

  // 4. Districts - group by operator code
  const distByCode = {};
  DISTRICT_DATA.forEach(d => {
    const k = d.oc.toUpperCase();
    if (!distByCode[k]) distByCode[k] = { name: d.on, guid: d.oi, items: [] };
    distByCode[k].items.push(d);
  });

  for (const [code, info] of Object.entries(distByCode)) {
    let e = map[code];
    if (!e) {
      // district-only entry
      e = { sysCode: code, clients: [info.name], awsServer: '', vmdbServer: '', url: '', removed: false, vmdbRemoved: false, vmdbOnly: false, districts: [], operatorName: '', operatorGuid: '' };
      map[code] = e;
    }
    e.operatorName = info.name;
    e.operatorGuid = info.guid;
    e.districts = info.items;
  }

  return Object.values(map).sort((a,b) => {
    const na = (a.clients[0] || a.operatorName || '').toUpperCase();
    const nb = (b.clients[0] || b.operatorName || '').toUpperCase();
    return na.localeCompare(nb);
  });
}

const MERGED = buildMerged();

function copyText(btn, text) {
  navigator.clipboard.writeText(text).then(() => {
    const orig = btn.innerHTML;
    btn.innerHTML = CHECK_ICON + 'Copied';
    btn.classList.add('copied');
    setTimeout(() => { btn.innerHTML = orig; btn.classList.remove('copied'); }, 1500);
  });
}

function toggleCreds() {
  const box = document.getElementById('credBox');
  const btn = document.getElementById('credToggle');
  const revealed = box.classList.toggle('revealed');
  btn.textContent = revealed ? 'Hide Credentials' : 'Show Credentials';
}

function esc(str) { const d = document.createElement('div'); d.textContent = str; return d.innerHTML; }

function highlight(text, q) {
  if (!q || !text) return esc(text || '');
  const escaped = esc(text);
  const qEsc = q.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  return escaped.replace(new RegExp(`(${qEsc})`, 'gi'), '<mark>$1</mark>');
}

// ── STATE ──
let activeAwsFilter = null;
let activeVmdbFilter = null;
let hideRemoved = true;
let expandedRows = new Set();
let sortCol = 'client';
let sortDir = 'asc';

// ── FILTER ──
function matchEntry(e, q) {
  if (!q) return true;
  const fields = [
    e.clients.join(' '), e.sysCode, e.awsServer, e.vmdbServer, e.url,
    e.operatorName, e.operatorGuid
  ];
  // Also search district names
  if (e.districts.length) {
    fields.push(...e.districts.map(d => d.dn + ' ' + d.dc + ' ' + d.di));
  }
  return fields.some(f => f && f.toLowerCase().includes(q));
}

function getFiltered(q) {
  return MERGED.filter(e => {
    if (hideRemoved && (e.removed || e.vmdbRemoved)) return false;
    if (activeAwsFilter && e.awsServer.toUpperCase() !== activeAwsFilter) return false;
    if (activeVmdbFilter && e.vmdbServer.toUpperCase() !== activeVmdbFilter) return false;
    return matchEntry(e, q);
  });
}

function sortEntries(arr) {
  const dir = sortDir === 'asc' ? 1 : -1;
  return [...arr].sort((a, b) => {
    let va, vb;
    switch (sortCol) {
      case 'client': va = (a.clients[0] || a.operatorName || '').toUpperCase(); vb = (b.clients[0] || b.operatorName || '').toUpperCase(); break;
      case 'sys': va = a.sysCode.toUpperCase(); vb = b.sysCode.toUpperCase(); break;
      case 'aws': va = a.awsServer.toUpperCase().replace(/(\d+)/g,m=>m.padStart(3,'0')); vb = b.awsServer.toUpperCase().replace(/(\d+)/g,m=>m.padStart(3,'0')); break;
      case 'vmdb': va = a.vmdbServer.toUpperCase().replace(/(\d+)/g,m=>m.padStart(3,'0')); vb = b.vmdbServer.toUpperCase().replace(/(\d+)/g,m=>m.padStart(3,'0')); break;
      case 'districts': va = a.districts.length; vb = b.districts.length; return (va - vb) * dir;
      default: va = ''; vb = '';
    }
    return va < vb ? -dir : va > vb ? dir : 0;
  });
}

// ── RENDER FILTERS ──
function renderFilters(q) {
  const bar = document.getElementById('filterBar');
  const all = MERGED.filter(e => matchEntry(e, q));

  // AWS servers
  const awsCounts = {};
  all.forEach(e => { if (e.awsServer) { const k = e.awsServer.toUpperCase(); awsCounts[k] = (awsCounts[k]||0)+1; } });
  const awsKeys = Object.keys(awsCounts).sort((a,b) => a.replace(/(\d+)/g,m=>m.padStart(3,'0')).localeCompare(b.replace(/(\d+)/g,m=>m.padStart(3,'0'))));

  // VMDB servers
  const vmdbCounts = {};
  all.forEach(e => { if (e.vmdbServer) { const k = e.vmdbServer.toUpperCase(); vmdbCounts[k] = (vmdbCounts[k]||0)+1; } });
  const vmdbKeys = Object.keys(vmdbCounts).sort((a,b) => a.replace(/(\d+)/g,m=>m.padStart(3,'0')).localeCompare(b.replace(/(\d+)/g,m=>m.padStart(3,'0'))));

  const hasFilter = activeAwsFilter || activeVmdbFilter;

  let h = '';
  // AWS group
  h += `<div class="filter-group"><span class="filter-label">AWS</span>`;
  h += awsKeys.map(k => {
    const label = k.replace('AWS-UVISIONPLUS','uVP');
    return `<a class="filter-chip ${activeAwsFilter===k?'active':''}" data-filter="aws" data-val="${esc(k)}">${label}<span class="chip-ct">${awsCounts[k]}</span></a>`;
  }).join('');
  h += `</div>`;

  // VMDB group
  h += `<div class="filter-group"><span class="filter-label">VMDB</span>`;
  h += vmdbKeys.map(k => {
    return `<a class="filter-chip ${activeVmdbFilter===k?'active':''}" data-filter="vmdb" data-val="${esc(k)}">${k}<span class="chip-ct">${vmdbCounts[k]}</span></a>`;
  }).join('');
  h += `</div>`;

  // Clear button
  h += `<button class="clear-filters ${hasFilter?'show':''}" id="clearFilters">Clear filters</button>`;

  bar.innerHTML = h;
}

// ── RENDER TABLE ──
function render() {
  const q = document.getElementById('search').value.trim().toLowerCase();
  const content = document.getElementById('content');

  renderFilters(q);

  const filtered = getFiltered(q);
  const sorted = sortEntries(filtered);

  // Stats
  const totalDist = filtered.reduce((s,e) => s+e.districts.length, 0);
  const awsSet = new Set(filtered.filter(e=>e.awsServer).map(e=>e.awsServer.toUpperCase()));
  const vmdbSet = new Set(filtered.filter(e=>e.vmdbServer).map(e=>e.vmdbServer.toUpperCase()));
  document.getElementById('stats').innerHTML =
    `<strong>${filtered.length}</strong> clients · <strong>${awsSet.size}</strong> AWS · <strong>${vmdbSet.size}</strong> VMDB · <strong>${totalDist}</strong> districts`;

  if (!sorted.length) {
    content.innerHTML = `<div class="no-results">No results${q ? ` for <kbd>${esc(q)}</kbd>` : ''}</div>`;
    return;
  }

  const arrows = col => `<span class="sort-arrow">${sortCol===col ? (sortDir==='asc'?'▲':'▼') : '▲'}</span>`;

  let h = `<table class="tbl"><thead><tr>
    <th class="${sortCol==='client'?'sorted':''}" data-sort="client">Client ${arrows('client')}</th>
    <th class="${sortCol==='sys'?'sorted':''}" data-sort="sys" style="width:7%">Code ${arrows('sys')}</th>
    <th class="${sortCol==='aws'?'sorted':''}" data-sort="aws" style="width:14%">AWS Server ${arrows('aws')}</th>
    <th class="${sortCol==='vmdb'?'sorted':''}" data-sort="vmdb" style="width:10%">VMDB ${arrows('vmdb')}</th>
    <th class="col-url" style="width:28%">URL</th>
    <th class="${sortCol==='districts'?'sorted':''}" data-sort="districts" style="width:10%">Districts ${arrows('districts')}</th>
    <th style="width:5%"></th>
  </tr></thead><tbody>`;

  for (const e of sorted) {
    const clientName = e.clients[0] || e.operatorName || '—';
    const isExpanded = expandedRows.has(e.sysCode);
    const rowClass = [
      e.removed ? 'removed' : '',
      isExpanded ? 'expanded' : ''
    ].filter(Boolean).join(' ');

    let badges = '';
    if (e.removed || e.vmdbRemoved) badges += ` <span class="badge badge-removed">removed</span>`;
    if (e.vmdbOnly && !e.removed) badges += ` <span class="badge badge-vmdb-only">vmdb only</span>`;

    const urlCell = e.url
      ? `<a href="${esc(e.url)}" target="_blank" rel="noopener">${highlight(e.url, q)}</a>`
      : '<span style="color:var(--text-muted)">—</span>';

    const distBtn = e.districts.length
      ? `<button class="dist-toggle ${isExpanded?'open':''}" data-code="${esc(e.sysCode)}">${e.districts.length} dist</button>`
      : '<span style="color:var(--text-muted);font-size:11px;font-family:IBM Plex Mono,monospace">—</span>';

    const copyCell = e.url
      ? `<button class="copy-btn" onclick="event.stopPropagation();copyText(this,'${esc(e.url)}')">${COPY_ICON}</button>`
      : '';

    h += `<tr class="${rowClass}" data-code="${esc(e.sysCode)}">
      <td class="col-client">${highlight(clientName, q)}${badges}</td>
      <td class="col-sys">${highlight(e.sysCode, q) || '<span style="color:var(--text-muted)">—</span>'}</td>
      <td class="col-aws">${highlight(e.awsServer, q) || '<span style="color:var(--text-muted)">—</span>'}</td>
      <td class="col-vmdb">${highlight(e.vmdbServer, q) || '<span style="color:var(--text-muted)">—</span>'}</td>
      <td class="col-url">${urlCell}</td>
      <td>${distBtn}</td>
      <td>${copyCell}</td>
    </tr>`;

    // District expansion row
    if (e.districts.length) {
      h += `<tr class="dist-row ${isExpanded?'open':''}" data-dist-code="${esc(e.sysCode)}">
        <td colspan="7">
          <div class="dist-inner">
            <div class="dist-header">
              <span class="dh-label">Operator</span>
              <span class="dh-val">${highlight(e.operatorName, q)}</span>
              <span class="dh-label" style="margin-left:auto">GUID</span>
              <span class="dh-val" style="flex:0 1 auto">${highlight(e.operatorGuid, q)}</span>
              <button class="copy-btn" onclick="event.stopPropagation();copyText(this,'${esc(e.operatorGuid)}')">${COPY_ICON} Copy</button>
            </div>
            <table class="dist-tbl">
              <thead><tr><th style="width:7%">Code</th><th style="width:35%">District</th><th>District GUID</th><th style="width:60px"></th></tr></thead>
              <tbody>`;
      for (const d of e.districts) {
        const hasGuid = d.di && d.di.length > 0;
        h += `<tr>
          <td class="d-code">${highlight(d.dc, q)}</td>
          <td class="d-name">${highlight(d.dn, q)}</td>
          <td class="d-guid">${hasGuid ? highlight(d.di, q) : '<span style="color:var(--text-muted)">—</span>'}</td>
          <td>${hasGuid ? `<button class="copy-btn" onclick="event.stopPropagation();copyText(this,'${esc(d.di)}')">${COPY_ICON}</button>` : ''}</td>
        </tr>`;
      }
      h += `</tbody></table></div></td></tr>`;
    }
  }

  h += '</tbody></table>';
  content.innerHTML = h;
}

// ── EVENTS ──
document.getElementById('search').addEventListener('input', render);

document.getElementById('filterBar').addEventListener('click', e => {
  const chip = e.target.closest('.filter-chip');
  if (chip) {
    const type = chip.dataset.filter;
    const val = chip.dataset.val;
    if (type === 'aws') activeAwsFilter = activeAwsFilter === val ? null : val;
    if (type === 'vmdb') activeVmdbFilter = activeVmdbFilter === val ? null : val;
    render();
    return;
  }
  if (e.target.closest('#clearFilters')) {
    activeAwsFilter = null;
    activeVmdbFilter = null;
    render();
  }
});

document.getElementById('content').addEventListener('click', e => {
  // Sort headers
  const th = e.target.closest('.tbl > thead th[data-sort]');
  if (th) {
    const col = th.dataset.sort;
    if (sortCol === col) sortDir = sortDir === 'asc' ? 'desc' : 'asc';
    else { sortCol = col; sortDir = 'asc'; }
    render();
    return;
  }
  // District toggle
  const toggle = e.target.closest('.dist-toggle');
  if (toggle) {
    const code = toggle.dataset.code;
    if (expandedRows.has(code)) expandedRows.delete(code);
    else expandedRows.add(code);
    render();
    return;
  }
});

document.addEventListener('keydown', e => {
  if (e.key === '/' && document.activeElement.tagName !== 'INPUT') { e.preventDefault(); document.getElementById('search').focus(); }
  if (e.key === 'Escape') document.getElementById('search').blur();
});

const searchInput = document.getElementById('search');
const kbdHint = document.getElementById('kbdHint');
searchInput.addEventListener('focus', () => kbdHint.style.opacity = '0');
searchInput.addEventListener('blur', () => { if (!searchInput.value) kbdHint.style.opacity = '1'; });

// Theme
// Hide removed toggle
document.getElementById('hideRemovedBtn').addEventListener('click', () => {
  hideRemoved = !hideRemoved;
  document.getElementById('hideRemovedBtn').classList.toggle('active', hideRemoved);
  const label = document.querySelector('#hideRemovedBtn span');
  if (label) label.textContent = hideRemoved ? 'Show removed' : 'Hide removed';
  render();
});

// Reset button
document.getElementById('resetBtn').addEventListener('click', () => {
  document.getElementById('search').value = '';
  activeAwsFilter = null;
  activeVmdbFilter = null;
  hideRemoved = true;
  expandedRows.clear();
  sortCol = 'client';
  sortDir = 'asc';
  document.getElementById('hideRemovedBtn').classList.add('active');
  const label = document.querySelector('#hideRemovedBtn span');
  if (label) label.textContent = 'Show removed';
  document.getElementById('kbdHint').style.opacity = '1';
  render();
  window.scrollTo({top: 0, behavior: 'smooth'});
});

document.getElementById('themeToggle').addEventListener('click', () => {
  document.documentElement.classList.toggle('light');
  try { localStorage.setItem('uvp-theme', document.documentElement.classList.contains('light') ? 'light' : 'dark'); } catch(e) {}
});
try { if (localStorage.getItem('uvp-theme') === 'light') document.documentElement.classList.add('light'); } catch(e) {}

render();
</script>
</body>
</html>
